slam_toolbox:
  ros__parameters:
    # --- The Critical Fixes for F1TENTH ---
    # 1. Match the Simulator's QoS (Best Effort)
    subscribe_to_scan: true
    scan_subscriber_qos_reliability: best_effort
    
    # 2. Match the Frame Names
    # Note: We use the BASE frame here, not the laser frame. 
    # The TF tree handles the offset to the laser automatically.
    base_frame: ego_racecar/base_link
    odom_frame: map
    map_frame: slam_map
    scan_topic: /scan
    mode: mapping

    # --- Standard Solver Settings ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    
    # --- Mapping Parameters ---
    transform_publish_period: 0.05
    map_update_interval: 5.0
    resolution: 0.05
    max_laser_range: 20.0 
    minimum_time_interval: 0.1
    minimum_angle_interval: 0.1
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true


    # In sim, slam and real do not overlap at the end of lap
    # Potential fixes below..

    # --- Stop slam from affecting past ---
    do_loop_closing: false

    # --- Force trust in odometry
    correlation_search_space_dimension: 0.1
    correlation_search_space_resolution: 0.01

    # --- Increase the matching threshold (be strictier) ---
    link_match_minimum_response_fine: 0.8

